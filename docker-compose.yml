# Список наших сервисов (контейнеров)
services:
  api:
    build: .
    ports:
      - "5000:5000"
    volumes:
      - .:/app/
    working_dir: /app/src/app/services/backend/
    links:
      - pgsql
    command: fastapi run main.py --port 5000

  pgsql:
    image: postgres:14
    volumes:
      - ./database/data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: 123456

  nodejs:
    image: node:22-alpine
    ports:
      - "8080:3000"
    user: "1000:1000"
    volumes:
      - .:/app/
    working_dir: /app/src/app/services/frontend/
    command: sh -c "rm -rf -- node_modules && npm i && npm run dev"

  grafana:
      image: grafana/grafana:latest
      ports:
        - "8083:3000"
      container_name: grafana
      restart: unless-stopped
      user: "1000:1000"
      environment:
        - TZ=Europe/Moscow
        - GF_SECURITY_ADMIN_USER=admin
        - GF_SECURITY_ADMIN_PASSWORD=123456
      volumes:
        - ./grafana/data:/var/lib/grafana  # Для сохранения данных (дашборды, настройки)
        - ./grafana/provisioning/:/etc/grafana/provisioning/  # Для провижининга (импорт дашбордов, источников данных)

